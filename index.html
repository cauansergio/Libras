<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossário de Libras - Abaetetuba</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Glossário de Libras de Abaetetuba</h1>
  <p>Veja a imagem do sinal e clique para assistir ao vídeo no Instagram</p>
  <span class="cidade">Abaetetuba &middot; Pará</span>
</header>

<nav class="tabs" id="tabsNav"></nav>

<div class="search-container">
  <input type="text" id="searchInput" placeholder="Buscar por nome..." aria-label="Buscar">
</div>

<div class="section-title">
  <h2 id="sectionTitle">Bairros</h2>
  <span class="contagem" id="sectionCount">0</span>
</div>

<main class="grid-container" id="gridContainer"></main>

<!-- ===== MODAL (vídeo incorporado do Instagram) ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalCloseBtn" aria-label="Fechar">&times;</button>
    <h2 id="modalTitle">Título do sinal</h2>
    <div class="instagram-embed-wrap" id="instagramEmbedWrap"></div>
    <p class="modal-fallback">Não carregou? <a id="modalLinkFallback" href="#" target="_blank" rel="noopener">Abrir no Instagram</a></p>
  </div>
</div>

<footer>
  <p>Glossário de Libras de Abaetetuba &mdash; desenvolvido por Cauan Sergio</p>
</footer>

<script src="script.js"></script>
</body>
</html>
